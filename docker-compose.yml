version: '3.8'

services:
  # QuestDB 数据库服务
  questdb:
    image: questdb/questdb:latest
    container_name: questdb-server
    restart: always
    ports:
      - "9000:9000"  # Web Console & HTTP API
      - "9009:9009"  # InfluxDB Line Protocol (ILP)
      - "8812:8812"  # PostgreSQL Wire Protocol
    shm_size: 1g  # 增加共享内存到1GB
    volumes:
      - questdb_data:/var/lib/questdb
      # - "D:/stockData:/var/lib/questdb"
    environment:
      - QDB_CAIRO_WAL_ENABLED_DEFAULT=false  # 禁用新表的WAL（position 表写入同步可见）
      - QDB_CAIRO_COMMIT_MODE=nosync  # 不做每次 fsync，避免 UPDATE 阻塞（非 WAL 表已即时可见）
      - QDB_PG_USER=admin
      - QDB_PG_PASSWORD=quest



  # 你的 Python MCP Server
  mcp-server:
    image: python:3.12-slim
    container_name: mcp-app
    working_dir: /app
    volumes:
      - .:/app 
      - /app/.venv
    environment:
      - UV_PROJECT_ENVIRONMENT=/app/.venv
      - QUESTDB_HOST=questdb 
    ports:
      - "8080:8080"
    depends_on:
      - questdb
    command: >
      sh -c "pip install uv && 
             uv sync && 
             .venv/bin/python MCPserver.py"


volumes:
  questdb_data:
