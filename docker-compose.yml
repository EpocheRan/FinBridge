services:
  questdb:
    image: questdb/questdb:latest
    container_name: questdb-server
    restart: unless-stopped
    ports:
      - "9000:9000"  # Web Console & HTTP API
      - "9009:9009"  # InfluxDB Line Protocol (ILP)
      - "8812:8812"  # PostgreSQL Wire Protocol
    shm_size: 1g
    volumes:
      - questdb_data:/var/lib/questdb
    environment:
      # 行情/财务表显式声明 WAL；持仓表保持非 WAL，支持原地 UPDATE
      - QDB_CAIRO_WAL_ENABLED_DEFAULT=false
      - QDB_CAIRO_COMMIT_MODE=nosync
      - QDB_PG_USER=admin
      - QDB_PG_PASSWORD=quest
      # 统一北京时间：交易日/「今天」的判断不能依赖容器默认的 UTC
      - TZ=Asia/Shanghai

  # 一次性数据库初始化服务；完成后退出。
  db-init:
    image: python:3.12-slim
    container_name: mcp-db-init
    working_dir: /app
    volumes:
      - .:/app
    environment:
      - RUNNING_IN_DOCKER=1
      - PYTHONUNBUFFERED=1
      - TZ=Asia/Shanghai
    depends_on:
      - questdb
    restart: "no"
    command: >
      sh -c "pip install --no-cache-dir psycopg2-binary==2.9.11 &&
             python scripts/init_database.py"

  mcp-server:
    image: python:3.12-slim
    container_name: mcp-app
    working_dir: /app
    volumes:
      - .:/app
      # 依赖持久化，避免每次重建容器都重新下载
      - mcp_venv:/app/.venv
    environment:
      - RUNNING_IN_DOCKER=1
      - UV_PROJECT_ENVIRONMENT=/app/.venv
      - QUESTDB_HOST=questdb
      - TZ=Asia/Shanghai
    ports:
      - "8080:8080"
    restart: unless-stopped
    depends_on:
      db-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import socket; socket.create_connection(('127.0.0.1', 8080), 3).close()"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
    command: >
      sh -c "pip install uv &&
             uv sync --frozen &&
             .venv/bin/python MCPserver.py"

volumes:
  questdb_data:
  mcp_venv:
