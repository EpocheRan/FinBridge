services:
  questdb:
    image: questdb/questdb:latest
    container_name: questdb-server
    restart: always
    ports:
      - "9000:9000"  # Web Console & HTTP API
      - "9009:9009"  # InfluxDB Line Protocol (ILP)
      - "8812:8812"  # PostgreSQL Wire Protocol
    shm_size: 1g
    volumes:
      - questdb_data:/var/lib/questdb
    environment:
      # 行情/财务表显式声明 WAL；持仓表保持非 WAL，支持原地 UPDATE
      - QDB_CAIRO_WAL_ENABLED_DEFAULT=false
      - QDB_CAIRO_COMMIT_MODE=nosync
      - QDB_PG_USER=admin
      - QDB_PG_PASSWORD=quest

  # 一次性数据库初始化服务；完成后退出。
  db-init:
    image: python:3.12-slim
    container_name: mcp-db-init
    working_dir: /app
    volumes:
      - .:/app
    environment:
      - RUNNING_IN_DOCKER=1
      - PYTHONUNBUFFERED=1
    depends_on:
      - questdb
    restart: "no"
    command: >
      sh -c "pip install --no-cache-dir psycopg2-binary &&
             python scripts/init_database.py"

  mcp-server:
    image: python:3.12-slim
    container_name: mcp-app
    working_dir: /app
    volumes:
      - .:/app
      # 依赖持久化，避免每次重建容器都重新下载
      - mcp_venv:/app/.venv
    environment:
      - RUNNING_IN_DOCKER=1
      - UV_PROJECT_ENVIRONMENT=/app/.venv
      - QUESTDB_HOST=questdb
    ports:
      - "8080:8080"
    depends_on:
      db-init:
        condition: service_completed_successfully
    command: >
      sh -c "pip install uv &&
             uv sync &&
             .venv/bin/python MCPserver.py"

volumes:
  questdb_data:
  mcp_venv:
