[project]
name = "quantproject"
version = "0.2.0"
description = "FinBridge MCP - market, financial and position data interface for AI agents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "akshare>=1.19.1",
    "baostock>=0.9.4",
    "fastmcp>=3.0.0b1,<4.0.0",
    "numpy>=2.0,<2.5",
    "pandas>=2.2.2,<3.0",
    "psycopg2-binary>=2.9.11",
    "requests>=2.31",
    "sqlalchemy>=2.0.46",
    "tushare>=1.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
backtest = [
    "lib-pybroker>=2.0.2,<2.1",
]

# PEP 735：uv 默认安装 dev 组，`uv run pytest` 开箱可用
[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# 沙箱下 %TEMP% 可能不可写，tempfile 会回退到项目根目录，
# 这里让 pytest 每轮结束即清理，避免留下 pytest-of-<user> 目录。
tmp_path_retention_count = 0
tmp_path_retention_policy = "none"
